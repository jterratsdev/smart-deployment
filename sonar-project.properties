sonar.projectKey=smart-deployment
sonar.projectName=Smart Deployment
sonar.projectVersion=1.2.6

sonar.sources=src,site/src,scripts,docs
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPath=tsconfig.json

sonar.exclusions=\
  **/node_modules/**,\
  lib/**,\
  coverage/**,\
  site/dist/**,\
  .agent-workflow/**,\
  .setup-agents/**,\
  .git/**,\
  **/*.tgz

sonar.test.exclusions=\
  **/node_modules/**,\
  lib/**,\
  coverage/**,\
  site/dist/**
