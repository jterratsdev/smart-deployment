name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ${{ vars.CI_LINUX_RUNNER == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","smart-deployment"]') }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build plugin
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --json

      - name: Verify package contents
        run: |
          PACK_OUTPUT="$(NPM_CONFIG_CACHE="$RUNNER_TEMP/.npm" npm pack --dry-run --ignore-scripts 2>&1)"
          echo "$PACK_OUTPUT"
          echo "$PACK_OUTPUT" | grep -q "lib/commands/start.js"
          echo "$PACK_OUTPUT" | grep -q "lib/commands/analyze.js"
          echo "$PACK_OUTPUT" | grep -q "lib/commands/validate.js"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
