name: SonarQube

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: yarn install --frozen-lockfile --network-timeout 600000

      - name: Run unit tests
        run: yarn test:only

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4.1.0
        env:
          SONAR_HOST_URL: https://sonarqube.jterrats.dev
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
